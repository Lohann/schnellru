[package]
name = "fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "fuzz-behavior-matches-lru"
path = "src/fuzz-behavior-matches-lru.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-internal-invariants"
path = "src/fuzz-internal-invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-by-memory-usage-works"
path = "src/fuzz-by-memory-usage-works.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = { version = "0.4.10", features = ["arbitrary-derive"] }
lru = "0.16.1"
schnellru = { path = ".." }
ahash = "0.8.12"
